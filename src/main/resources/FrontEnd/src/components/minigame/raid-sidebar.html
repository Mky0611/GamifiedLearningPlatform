    </div>
    <span class="boss-orb"><i class="bi bi-ghost"></i></span>
  </div>

  <div class="raid-metric mb-3">
    <div class="d-flex justify-content-between small-text">
      <span>Boss HP</span>
      <span id="bossHpText">100 / 100</span>
    </div>
    <div class="progress soft-progress mt-2" role="progressbar" aria-valuemin="0" aria-valuemax="100">

    </div>
    <div class="progress soft-progress mt-2" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar bg-warning-soft" id="bossShieldBar" style="width: 60%"></div>
    </div>
  </div>

  <div class="raid-metric mb-4">
    <div class="d-flex justify-content-between small-text">
      <span>Rage</span>
      <span id="bossRageText">18</span>
    </div>
    <div class="progress soft-progress mt-2" role="progressbar" aria-valuemin="0" aria-valuemax="100">
      <div class="progress-bar bg-purple-soft" id="bossRageBar" style="width: 18%"></div>
    </div>
  </div>

  <div class="objective-box">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0">Objective</h5>
      <span class="tiny-pill">Stage 03</span>

      <li><i class="bi bi-circle"></i>Đoán đúng core word để gây burst damage</li>
    </ul>
  </div>

  <div class="clue-box mt-4">
    <span class="overline">Meaning clue</span>
    <p class="mb-0">
      Verb - liên quan đến quá trình biến source code thành chương trình có thể chạy được.
    </p>
  </div>
