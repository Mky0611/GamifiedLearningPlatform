# ==============================================================================
# GamifiedLearningPlatform - application-prod.properties (Production Environment)
# ==============================================================================

# SQL Server Production Connection
# Bat buoc su dung ket noi ma hoa TLS (encrypt=true) voi chung chi hop le (trustServerCertificate=false)
# Khong su dung tai khoan quan tri he thong (sa) o Production; su dung tai khoan phan quyen toi thieu glp_app
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://db.prod.internal:1433;databaseName=GamifiedLearningPlatform;encrypt=true;trustServerCertificate=false}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:glp_app}
# Mat khau Production bat buoc phai duoc truyen qua bien moi truong, khong co gia tri mac dinh
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA / Hibernate Production Settings (Tat debug logs, tang hieu nang)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# App Security Production (Phai duoc khai bao mien domain thuc te)
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:https://lexraid.example.com}
