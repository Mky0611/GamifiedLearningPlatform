spring.application.name=GamifiedLearningPlatform
server.port=${SERVER_PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==============================
# SQL Server connection
# ==============================
# Luu y bao mat: Khong commit mat khau hoac thong tin xac thuc truc tiep vao file nay.
# Cau hinh su dung Environment Variables; gia tri mac dinh chi dung cho local development.
# Dat bien moi truong: SPRING_DATASOURCE_PASSWORD=<mat_khau_cua_ban>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=GamifiedLearningPlatform;encrypt=false;trustServerCertificate=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.open-in-view=false

# Neu ban dang dung schema glp trong cung database, doi dong duoi thanh glp
# spring.jpa.properties.hibernate.default_schema=glp

# ==============================
# Logging
# ==============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==============================
# Custom app properties
# ==============================
app.frontend.base-path=/ui
app.security.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
