spring.application.name=GamifiedLearningPlatform
server.port=8080

# ==============================
# SQL Server connection
# ==============================
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GamifiedLearningPlatform;encrypt=false;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_schema=dbo
spring.jpa.open-in-view=false

# Neu ban dang dung schema glp trong cung database, doi dong duoi thanh glp
# spring.jpa.properties.hibernate.default_schema=glp

# ==============================
# Logging
# ==============================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==============================
# Custom app properties
# ==============================
app.frontend.base-path=/ui
app.security.cors-allowed-origins=http://localhost:8080,http://127.0.0.1:8080
